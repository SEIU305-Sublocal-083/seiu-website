name: Strike Prep previews

on:
  pull_request:
    branches: ['strike-prep/**']
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'test-pages/strike/**'
      - 'scripts/build_strike_review.py'
      - '.github/workflows/strike-review.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r test-pages/strike/requirements.txt
      - run: python scripts/build_strike_review.py --check
